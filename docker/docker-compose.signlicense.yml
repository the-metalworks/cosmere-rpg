services:
  foundry:
    hostname: foundry-ci
    build:
      context: ..
      dockerfile: ./docker/dockerfile
      additional_contexts:
        world-seed: ../world-seed
      args:
        FOUNDRY_VERSION: ${FOUNDRY_VERSION}
        QUENCH_MODULE_URL: ${QUENCH_MODULE_URL}
    ports:
      - "30000:30000"
    volumes:
      - ../build:/data/Data/systems/cosmere-rpg

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000"]
      interval: 5s
      timeout: 10s
      retries: 12
