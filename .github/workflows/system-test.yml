name: "Playwright System Tests"
run-name: "Playwright Tests for PR #${{ github.event.pull_request.number }}"
on:
  workflow_call:
jobs:
  system_test:

    runs-on: ubuntu-latest
    needs: build
    steps:

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: system-build
        path: build/

    - name: Fix compendium permissions
      run: chmod -R a+rwX build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Checkout world seed
      uses: actions/checkout@v4
      with:
        repository: the-metalworks/docker-world-seed
        token: ${{ secrets.WORLD_SEED_REPO_PAT }}
        path: ./world-seed

    - name: Install world-seed dependencies
      run: cd world-seed && npm ci && cd ..

    - name: Run Playwright tests
      env:
        FOUNDRY_LICENSE_JSON: ${{ secrets.FOUNDRY_LICENSE_JSON }}
      run: npm run test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30