name: "Playwright System Tests"
on:
  workflow_call:
    inputs:
      system-artifact:
        required: true
        type: string
    secrets:
      FOUNDRY_LICENSE_JSON:
        required: true
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        registry-url: https://npm.pkg.github.com
        scope: "@the-metalworks"

    - name: Install dependencies
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Download build output
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.system-artifact }}
        path: build/

    - name: Fix compendium permissions
      run: chmod -R a+rwX build

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v7
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Playwright tests
      env:
        FOUNDRY_LICENSE_JSON: ${{ secrets.FOUNDRY_LICENSE_JSON }}
      run: npm run test

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30